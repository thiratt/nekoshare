name: nekoshare-dev

services:
    database:
        image: mysql:8.4
        restart: unless-stopped
        env_file:
            - .env.dev
        command:
            - mysqld
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        ports:
            - "7770:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s

    redis:
        image: redis:8.6-alpine
        restart: unless-stopped
        env_file:
            - .env.dev
        command:
            - sh
            - -lc
            - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        ports:
            - "7771:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 10s

    phpmyadmin:
        image: phpmyadmin:5-apache
        restart: unless-stopped
        environment:
            PMA_HOST: database
            PMA_PORT: 3306
        ports:
            - "7772:80"
        # For custom themes. Just delete it if you don't need :)
        # volumes:
        #   - ../~/theme:/var/www/html/themes/ttm
        depends_on:
            database:
                condition: service_healthy

    redis-insight:
        image: redislabs/redisinsight:3.2
        restart: unless-stopped
        ports:
            - "7773:5540"
        volumes:
            - redis-insight-data:/data

volumes:
    mysql-data:
    redis-data:
    redis-insight-data:
