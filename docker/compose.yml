name: nekoshare

services:
    database:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            TZ: ${TZ:-UTC}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-nekoshare}
            MYSQL_USER: ${MYSQL_USER:-nekoshare}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
        command:
            - mysqld
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 20s

    redis:
        image: redis:8.6-alpine
        restart: unless-stopped
        environment:
            TZ: ${TZ:-UTC}
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        command:
            - redis-server
            - --appendonly
            - "yes"
            - --requirepass
            - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 10s

    server:
        build:
            context: ..
            dockerfile: apps/server/Dockerfile
        restart: unless-stopped
        environment:
            NODE_ENV: production
            TZ: ${TZ:-UTC}
            DATABASE_HOST: database
            DATABASE_PORT: 3306
            DATABASE_NAME: ${MYSQL_DATABASE:-nekoshare}
            DATABASE_USER: ${MYSQL_USER:-nekoshare}
            DATABASE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
            REDIS_HOST: redis
            REDIS_PORT: 6379
            REDIS_USERNAME: ${REDIS_USERNAME:-}
            REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
            REDIS_DB: ${REDIS_DB:-0}
            APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
            BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
            APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
            CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
            R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
            R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
            R2_USER_PROFILE_BUCKET: ${R2_USER_PROFILE_BUCKET:-user-profile}
            R2_USER_PROFILE_PUBLIC_BASE_URL: ${R2_USER_PROFILE_PUBLIC_BASE_URL:-}
            RESEND_API_KEY: ${RESEND_API_KEY:-}
            RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
            NODE_ID: ${NODE_ID:-}
        depends_on:
            database:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:7780/').then(() => process.exit(0)).catch(() => process.exit(1))",
                ]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 30s

    web:
        build:
            context: ..
            dockerfile: apps/web/Dockerfile
            args:
                WEB_API_BASE_URL: ${WEB_API_BASE_URL:?WEB_API_BASE_URL is required}
                WEB_WS_BASE_URL: ${WEB_WS_BASE_URL:?WEB_WS_BASE_URL is required}
        restart: unless-stopped
        expose:
            - "8080"
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 10s

    nginx:
        build:
            context: ..
            dockerfile: nginx/Dockerfile
        restart: unless-stopped
        environment:
            API_SERVER_NAME: ${API_SERVER_NAME:?API_SERVER_NAME is required}
            WEB_SERVER_NAME: ${WEB_SERVER_NAME:?WEB_SERVER_NAME is required}
            SHARE_SERVER_NAME: ${SHARE_SERVER_NAME:?SHARE_SERVER_NAME is required}
            SHORTLINK_SERVER_NAME: ${SHORTLINK_SERVER_NAME:-}
            SHORTLINK_REDIRECT_HOST: ${SHORTLINK_REDIRECT_HOST:-}
            NS_SERVER_NAME: ${NS_SERVER_NAME:?NS_SERVER_NAME is required}
        volumes:
            - ../ca/cloudflare:/etc/nginx/tls:ro
        ports:
            - "${HTTP_PORT:-80}:80"
            - "${HTTPS_PORT:-443}:443"
        depends_on:
            server:
                condition: service_healthy
            web:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
            interval: 15s
            timeout: 5s
            retries: 10
            start_period: 10s

volumes:
    mysql-data:
    redis-data:
