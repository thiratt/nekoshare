[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nk-cli"
version = "0.1.0"
description = "Neko Share control CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nk = "nk_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
